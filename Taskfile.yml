version: '3'

tasks:
  diagnostics:preview:
    desc: Preview generated support metadata without writing a bundle
    requires:
      vars: [REQUEST]
    env:
      FLOW_SUPPORT_REQUEST: '{{.REQUEST}}'
    cmds:
      - flow diagnostics-preview --request "$FLOW_SUPPORT_REQUEST" --format json

  diagnostics:bundle:
    desc: Create a private generated support bundle without upload
    requires:
      vars: [REQUEST, OUTPUT]
    env:
      FLOW_SUPPORT_REQUEST: '{{.REQUEST}}'
      FLOW_SUPPORT_OUTPUT: '{{.OUTPUT}}'
    cmds:
      - flow diagnostics-bundle --request "$FLOW_SUPPORT_REQUEST" --output "$FLOW_SUPPORT_OUTPUT" --format json

  diagnostics:inspect:
    desc: Inspect support bundle structure without extraction or execution
    requires:
      vars: [BUNDLE]
    env:
      FLOW_SUPPORT_BUNDLE: '{{.BUNDLE}}'
    cmds:
      - flow diagnostics-inspect --bundle "$FLOW_SUPPORT_BUNDLE" --format json

  observability:doctor:
    desc: Describe Flow-owned operational signal support without probing a collector
    cmds:
      - flow doctor-observability --format json

  ai:doctor:
    desc: Inspect selected local AI profile without contacting a runtime
    requires:
      vars: [PROFILE]
    env:
      FLOW_LOCAL_AI_PROFILE: '{{.PROFILE}}'
    cmds:
      - flow ai-doctor --profile "$FLOW_LOCAL_AI_PROFILE" --format json

  ai:prepare:
    desc: Prepare private documents for explicitly selected existing AI assets
    requires:
      vars: [REQUEST, OUTPUT]
    env:
      FLOW_LOCAL_AI_REQUEST: '{{.REQUEST}}'
      FLOW_LOCAL_AI_OUTPUT: '{{.OUTPUT}}'
    cmds:
      - flow ai-prepare --request "$FLOW_LOCAL_AI_REQUEST" --output-directory "$FLOW_LOCAL_AI_OUTPUT" --format json

  ai:status:
    desc: Reobserve an exact private local AI setup bundle
    requires:
      vars: [DIRECTORY, MARKER_SHA256]
    env:
      FLOW_LOCAL_AI_DIRECTORY: '{{.DIRECTORY}}'
      FLOW_LOCAL_AI_MARKER_SHA256: '{{.MARKER_SHA256}}'
    cmds:
      - flow ai-setup-status --directory "$FLOW_LOCAL_AI_DIRECTORY" --marker-sha256 "$FLOW_LOCAL_AI_MARKER_SHA256" --format json

  publication:project:preview:
    desc: Preview explicit static publication locale/source branches
    requires:
      vars: [PROJECT]
    env:
      FLOW_STATIC_PROJECT: '{{.PROJECT}}'
    cmds:
      - flow publication-project-preview --project "$FLOW_STATIC_PROJECT" --format json

  publication:project:prepare:
    desc: Prepare static publication plans without provider execution or approval
    requires:
      vars: [PROJECT]
    env:
      FLOW_STATIC_PROJECT: '{{.PROJECT}}'
    cmds:
      - flow publication-project-prepare --project "$FLOW_STATIC_PROJECT" --format json

  publication:project:status:
    desc: Read static project identity and accepted required-artifact coverage
    requires:
      vars: [WORKSPACE, RECORD_SHA256]
    env:
      FLOW_STATIC_WORKSPACE: '{{.WORKSPACE}}'
      FLOW_STATIC_RECORD_SHA256: '{{.RECORD_SHA256}}'
    cmds:
      - flow publication-project-status --workspace "$FLOW_STATIC_WORKSPACE" --record-sha256 "$FLOW_STATIC_RECORD_SHA256" --format json

  publishing:readiness:
    desc: Report exact package files, recorded audio checks and remaining operator actions
    requires:
      vars: [REQUEST]
    env:
      FLOW_PUBLISHING_READINESS_REQUEST: '{{.REQUEST}}'
    cmds:
      - flow publishing-readiness --request "$FLOW_PUBLISHING_READINESS_REQUEST" --format json

  audio:setup:preview:
    desc: Preview installed audio-check selection without running providers
    requires:
      vars: [REQUEST]
    env:
      FLOW_AUDIO_SETUP_REQUEST: '{{.REQUEST}}'
    cmds:
      - flow audio-setup-preview --request "$FLOW_AUDIO_SETUP_REQUEST" --format json

  audio:setup:prepare:
    desc: Prepare fresh audio-check configuration and plans without approvals
    requires:
      vars: [REQUEST]
    env:
      FLOW_AUDIO_SETUP_REQUEST: '{{.REQUEST}}'
    cmds:
      - flow audio-setup-prepare --request "$FLOW_AUDIO_SETUP_REQUEST" --format json

  audio:setup:status:
    desc: Read retained audio-check preparation identity
    requires:
      vars: [WORKSPACE, RECORD_SHA256]
    env:
      FLOW_AUDIO_SETUP_WORKSPACE: '{{.WORKSPACE}}'
      FLOW_AUDIO_SETUP_RECORD_SHA256: '{{.RECORD_SHA256}}'
    cmds:
      - flow audio-setup-status --workspace "$FLOW_AUDIO_SETUP_WORKSPACE" --record-sha256 "$FLOW_AUDIO_SETUP_RECORD_SHA256" --format json

  audio:setup:bind:
    desc: Bind separately supplied exact approvals into an audio-readiness request
    requires:
      vars: [WORKSPACE, RECORD_SHA256, APPROVALS, OUTPUT]
    env:
      FLOW_AUDIO_SETUP_WORKSPACE: '{{.WORKSPACE}}'
      FLOW_AUDIO_SETUP_RECORD_SHA256: '{{.RECORD_SHA256}}'
      FLOW_AUDIO_SETUP_APPROVALS: '{{.APPROVALS}}'
      FLOW_AUDIO_SETUP_OUTPUT: '{{.OUTPUT}}'
    cmds:
      - flow audio-setup-bind --workspace "$FLOW_AUDIO_SETUP_WORKSPACE" --record-sha256 "$FLOW_AUDIO_SETUP_RECORD_SHA256" --approvals "$FLOW_AUDIO_SETUP_APPROVALS" --output "$FLOW_AUDIO_SETUP_OUTPUT" --format json

  audio:readiness:preview:
    desc: Preview selected publishing audio checks without invoking providers
    requires:
      vars: [REQUEST]
    env:
      FLOW_AUDIO_REQUEST: '{{.REQUEST}}'
    cmds:
      - flow audio-readiness-preview --request "$FLOW_AUDIO_REQUEST" --format json

  audio:readiness:run:
    desc: Run selected source-candidate audio checks using supplied exact approvals
    requires:
      vars: [REQUEST]
    env:
      FLOW_AUDIO_REQUEST: '{{.REQUEST}}'
    cmds:
      - flow audio-readiness-run --request "$FLOW_AUDIO_REQUEST" --format json

  release:plan:
    desc: Describe source release preparation; no build or publication
    cmds:
      - python3 scripts/release/package.py plan

  release:prepare:
    desc: Explicit native offline build/package into fresh external directories
    requires:
      vars: [SOURCE_REVISION, TARGET, COHORT, WORK, OUTPUT]
    env:
      FLOW_RELEASE_REVISION: '{{.SOURCE_REVISION}}'
      FLOW_RELEASE_TARGET: '{{.TARGET}}'
      FLOW_RELEASE_COHORT: '{{.COHORT}}'
      FLOW_RELEASE_WORK: '{{.WORK}}'
      FLOW_RELEASE_OUTPUT: '{{.OUTPUT}}'
    cmds:
      - python3 scripts/release/package.py prepare --source-revision "$FLOW_RELEASE_REVISION" --target "$FLOW_RELEASE_TARGET" --cohort "$FLOW_RELEASE_COHORT" --work-directory "$FLOW_RELEASE_WORK" --output "$FLOW_RELEASE_OUTPUT"

  release:verify:
    desc: Observe exact supplied candidate package bytes without executing them
    requires:
      vars: [PACKAGE, MANIFEST_SHA256]
    env:
      FLOW_RELEASE_PACKAGE: '{{.PACKAGE}}'
      FLOW_RELEASE_MANIFEST_SHA256: '{{.MANIFEST_SHA256}}'
    cmds:
      - python3 scripts/release/package.py verify --package-directory "$FLOW_RELEASE_PACKAGE" --manifest-sha256 "$FLOW_RELEASE_MANIFEST_SHA256"

  release:publish:
    desc: Print a manual publication handoff; never create tags or releases
    requires:
      vars: [PACKAGE, MANIFEST_SHA256]
    env:
      FLOW_RELEASE_PACKAGE: '{{.PACKAGE}}'
      FLOW_RELEASE_MANIFEST_SHA256: '{{.MANIFEST_SHA256}}'
    cmds:
      - python3 scripts/release/package.py handoff --package-directory "$FLOW_RELEASE_PACKAGE" --manifest-sha256 "$FLOW_RELEASE_MANIFEST_SHA256"

  release:report:publisher:
    desc: Assemble an unsigned publisher report from exact existing release files.
    requires:
      vars: [REQUEST, OUTPUT_DIRECTORY]
    env:
      OWNER_REPORT_REQUEST: '{{.REQUEST}}'
      OWNER_REPORT_OUTPUT: '{{.OUTPUT_DIRECTORY}}'
    cmds:
      - python3 scripts/owner_reports.py publisher --request "$OWNER_REPORT_REQUEST" --output-directory "$OWNER_REPORT_OUTPUT"

  release:report:qualified:
    desc: Assemble an unsigned report from supplied real positive native evidence.
    requires:
      vars: [REQUEST, OUTPUT_DIRECTORY]
    env:
      OWNER_REPORT_REQUEST: '{{.REQUEST}}'
      OWNER_REPORT_OUTPUT: '{{.OUTPUT_DIRECTORY}}'
    cmds:
      - python3 scripts/owner_reports.py qualified --request "$OWNER_REPORT_REQUEST" --output-directory "$OWNER_REPORT_OUTPUT"
