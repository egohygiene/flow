[package]
name = "flow"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Deterministic orchestration contracts and extension seams for the Ego Hygiene suite"
license = "MIT"
repository = "https://github.com/egohygiene/flow"
publish = false

[[bin]]
name = "flow-hermetic-provider"
path = "tests/fixtures/hermetic-provider/main.rs"
test = false
bench = false

[dependencies]
fs2 = "0.4.3"
semver = "1.0.26"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
thiserror = "2.0.12"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30.1", default-features = false, features = ["process", "signal"] }

[dev-dependencies]

# Conformance tests copy and hash the exact executable repeatedly. Debug symbols
# are not part of the contract; omit them to keep the PR fixture budget bounded.
[profile.test]
debug = 0

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
